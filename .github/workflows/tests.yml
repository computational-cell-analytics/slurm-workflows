name: tests

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # 3.6 is the Python of the login node. setup-python has no 3.6 for the current runners.
        python: ["3.6", "3.14"]
    container: python:${{ matrix.python }}
    steps:
      - uses: actions/checkout@v5
      - run: python -m pip install flake8
      - run: python -m flake8 --isolated --max-line-length=120 .
      - run: python -m unittest discover -s tests -t .
